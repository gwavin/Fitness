plugins { id 'com.android.application' }
android {
    namespace 'ie.gavinhoran.fitnessclockbridge'
    compileSdk 34
    defaultConfig {
        applicationId 'ie.gavinhoran.fitnessclockbridge'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-preview'
        testInstrumentationRunner 'ie.gavinhoran.fitnessclockbridge.BridgeChecks'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
