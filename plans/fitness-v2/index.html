<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123e35">
  <title>Fitness · Today</title>
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-head"><a href="../../index.html">Fitness</a><span>YOUR DAILY PRACTICE</span><a href="../todays-workout-classic.html">Classic ↗</a></header>
  <nav class="tabs" aria-label="App"><button data-view="today">Today</button><button data-view="history">History</button><button data-view="settings">Settings & backup</button></nav>
  <p id="storage-status" class="storage-status" role="status">Private on this browser · Not backed up</p>
  <p id="offline-status" class="notice" role="status">Offline cache not ready yet. Keep this page open while it primes.</p>
  <main id="app" tabindex="-1"><p>Loading your workout…</p></main>
  <noscript>This workout app needs JavaScript. <a href="../todays-workout-classic.html">Open Classic</a>.</noscript>
  <aside id="timer" class="timer" aria-label="Rest timer">
    <div class="timer-top"><span id="timer-state">REST TIMER</span><output id="timer-display" aria-label="Time remaining">01:30</output><button id="timer-reset">Reset</button></div>
    <div class="timer-controls"><button id="timer-minus" aria-label="Reduce timer by 15 seconds">−15 s</button><button id="timer-toggle" class="primary">Start</button><button id="timer-plus" aria-label="Add 15 seconds">+15 s</button></div>
    <p class="capability">Background alerts: <strong>best effort · use Android Clock for Spotify</strong></p>
    <span id="timer-announcement" class="sr-only" role="status"></span>
  </aside>
  <script src="../coaching-runner/current-workout.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
