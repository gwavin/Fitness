<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123e35">
  <title>Fitness v7 · Hands-free</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-head"><a href="./index.html">Fitness v7</a><span>HANDS-FREE PILOT</span></header>
  <nav class="tabs" aria-label="App"><button data-view="today">Today</button><button data-view="history">History</button><button data-view="settings">Settings & backup</button></nav>
  <p id="storage-status" class="storage-status" role="status">Private on this browser · Not backed up</p>
  <p id="offline-status" class="notice" role="status">Offline cache not ready yet. Keep this page open while it primes.</p>
  <section id="hr-panel" class="card" hidden aria-label="Garmin recording">
    <div class="row"><button id="hr-connect" type="button">Add Garmin HRM</button><small id="hr-status" role="status">Garmin optional</small><span id="hr-reading"></span></div>
  </section>
  <main id="app" tabindex="-1"><p>Loading your workout…</p></main>
  <noscript>This workout app needs JavaScript.</noscript>
  <aside id="timer" class="timer" aria-label="Timed set">
    <div id="hold-timer" class="row" hidden>
      <span id="timer-state">TIMED SET</span><output id="timer-display" role="timer" aria-label="Timed set remaining"></output><button id="timer-reset" type="button">Dismiss</button>
    </div>
    <span id="timer-announcement" class="sr-only" role="status"></span>
  </aside>
  <script src="./current-workout.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
